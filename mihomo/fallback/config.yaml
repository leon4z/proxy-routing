      - "tls://223.5.5.5:853"
      - "tls://120.53.53.53:853"
  "fake-ip-filter":
    - "*.lan"
    - "*.local"
    - "localhost"
    - "+.pool.ntp.org"
    - "time.*.com"
    - "ntp.*.com"
    - "msftconnecttest.com"
    - "msftncsi.com"
