# Remote rule sets generated from V2Fly and MetaCubeX. No node credentials.
[General]
ipv6 = false
block-quic = always-allow
udp-policy-not-supported-behaviour = REJECT
dns-server = https://1.1.1.1/dns-query#proxy,https://8.8.8.8/dns-query#proxy
direct-dns-server = tls://223.5.5.5:853,https://doh.pub/dns-query
proxy-dns-server = tls://223.5.5.5:853,https://doh.pub/dns-query
fallback-dns-server = https://1.1.1.1/dns-query#proxy,https://8.8.8.8/dns-query#proxy
dns-direct-system = false
dns-direct-fallback-proxy = false
always-real-ip = *.lan,*.local,localhost,pool.ntp.org,*.pool.ntp.org,time.*.com,ntp.*.com,msftconnecttest.com,msftncsi.com

[Proxy]

[Proxy Group]
默认代理 = select,PROXY,全部节点,香港节点,台湾节点,日本节点,新加坡节点,韩国节点,美国节点,其他地区,REJECT
AI = select,默认代理,香港节点,台湾节点,日本节点,新加坡节点,韩国节点,美国节点,其他地区,全部节点,DIRECT,REJECT
OpenAI = select,AI,默认代理,香港节点,台湾节点,日本节点,新加坡节点,韩国节点,美国节点,其他地区,全部节点,DIRECT,REJECT
Claude = select,AI,默认代理,香港节点,台湾节点,日本节点,新加坡节点,韩国节点,美国节点,其他地区,全部节点,DIRECT,REJECT
Google = select,默认代理,香港节点,台湾节点,日本节点,新加坡节点,韩国节点,美国节点,其他地区,全部节点,DIRECT,REJECT
影音社交 = select,默认代理,香港节点,台湾节点,日本节点,新加坡节点,韩国节点,美国节点,其他地区,全部节点,DIRECT,REJECT
金融 = select,DIRECT,默认代理,香港节点,台湾节点,日本节点,新加坡节点,韩国节点,美国节点,其他地区,全部节点,REJECT
兜底 = select,默认代理,香港节点,台湾节点,日本节点,新加坡节点,韩国节点,美国节点,其他地区,全部节点,DIRECT,REJECT
共享遥测 = select,全部节点,香港节点,台湾节点,日本节点,新加坡节点,韩国节点,美国节点,其他地区,REJECT,hidden=true
香港节点 = select,policy-regex-filter=(?i)香港|Hong[ -]?Kong|🇭🇰|(?:^|[^a-z])(?:HK|HKG)(?:[^a-z]|$)
台湾节点 = select,policy-regex-filter=(?i)台湾|台灣|臺灣|台北|臺北|台中|臺中|新北|彰化|Taiwan|Taipei|Taichung|🇹🇼|(?:^|[^a-z])(?:TW|TWN)(?:[^a-z]|$)
日本节点 = select,policy-regex-filter=(?i)日本|东京|東京|大阪|Japan|Tokyo|Osaka|🇯🇵|(?:^|[^a-z])(?:JP|JPN)(?:[^a-z]|$)
新加坡节点 = select,policy-regex-filter=(?i)新加坡|狮城|獅城|Singapore|🇸🇬|(?:^|[^a-z])(?:SG|SGP)(?:[^a-z]|$)
韩国节点 = select,policy-regex-filter=(?i)韩国|韓國|首尔|首爾|春川|Korea|Seoul|Chuncheon|🇰🇷|(?:^|[^a-z])(?:KR|KOR)(?:[^a-z]|$)
美国节点 = select,policy-regex-filter=(?i)美国|美國|美西|美东|美東|洛杉矶|洛杉磯|西雅图|西雅圖|纽约|紐約|芝加哥|凤凰城|鳳凰城|圣何塞|聖荷西|United[ -]?States|Los[ -]?Angeles|San[ -]?Jose|Seattle|New[ -]?York|Chicago|Phoenix|🇺🇸|(?:^|[^a-z])USA?(?:[^a-z]|$)
其他地区 = select,policy-regex-filter=(?i)^(?!.*(?:香港|Hong[ -]?Kong|🇭🇰|(?:^|[^a-z])(?:HK|HKG)(?:[^a-z]|$)|台湾|台灣|臺灣|台北|臺北|台中|臺中|新北|彰化|Taiwan|Taipei|Taichung|🇹🇼|(?:^|[^a-z])(?:TW|TWN)(?:[^a-z]|$)|日本|东京|東京|大阪|Japan|Tokyo|Osaka|🇯🇵|(?:^|[^a-z])(?:JP|JPN)(?:[^a-z]|$)|新加坡|狮城|獅城|Singapore|🇸🇬|(?:^|[^a-z])(?:SG|SGP)(?:[^a-z]|$)|韩国|韓國|首尔|首爾|春川|Korea|Seoul|Chuncheon|🇰🇷|(?:^|[^a-z])(?:KR|KOR)(?:[^a-z]|$)|美国|美國|美西|美东|美東|洛杉矶|洛杉磯|西雅图|西雅圖|纽约|紐約|芝加哥|凤凰城|鳳凰城|圣何塞|聖荷西|United[ -]?States|Los[ -]?Angeles|San[ -]?Jose|Seattle|New[ -]?York|Chicago|Phoenix|🇺🇸|(?:^|[^a-z])USA?(?:[^a-z]|$))).*$
全部节点 = select,policy-regex-filter=.*

