# Remote rule sets generated from the full MetaCubeX snapshot. No node credentials.
[General]
ipv6 = false
block-quic = all
udp-policy-not-supported-behaviour = REJECT
dns-server = https://1.1.1.1/dns-query#proxy,https://8.8.8.8/dns-query#proxy
direct-dns-server = tls://223.5.5.5:853,tls://120.53.53.53:853
proxy-dns-server = tls://223.5.5.5:853,tls://120.53.53.53:853
fallback-dns-server = https://1.1.1.1/dns-query#proxy,https://8.8.8.8/dns-query#proxy
dns-direct-system = false
dns-direct-fallback-proxy = false
always-real-ip = *.lan,*.local,localhost,pool.ntp.org,*.pool.ntp.org,time.*.com,ntp.*.com,msftconnecttest.com,msftncsi.com

[Proxy]

[Proxy Group]
香港节点 = url-test,policy-regex-filter=香港|Hong Kong|HK,interval=600,timeout=5,url=https://www.gstatic.com/generate_204,tolerance=50
台湾节点 = url-test,policy-regex-filter=台湾|Taiwan|TW,interval=600,timeout=5,url=https://www.gstatic.com/generate_204,tolerance=50
日本节点 = url-test,policy-regex-filter=日本|Japan|JP,interval=600,timeout=5,url=https://www.gstatic.com/generate_204,tolerance=50
新加坡节点 = url-test,policy-regex-filter=新加坡|Singapore|SG,interval=600,timeout=5,url=https://www.gstatic.com/generate_204,tolerance=50
美国节点 = url-test,policy-regex-filter=美国|United States|USA|US,interval=600,timeout=5,url=https://www.gstatic.com/generate_204,tolerance=50
英国节点 = url-test,policy-regex-filter=英国|United Kingdom|UK,interval=600,timeout=5,url=https://www.gstatic.com/generate_204,tolerance=50
德国节点 = url-test,policy-regex-filter=德国|Germany|DE,interval=600,timeout=5,url=https://www.gstatic.com/generate_204,tolerance=50
韩国节点 = url-test,policy-regex-filter=韩国|Korea|KR,interval=600,timeout=5,url=https://www.gstatic.com/generate_204,tolerance=50
澳大利亚节点 = url-test,policy-regex-filter=澳大利亚|Australia|AU,interval=600,timeout=5,url=https://www.gstatic.com/generate_204,tolerance=50
马来西亚节点 = url-test,policy-regex-filter=马来西亚|Malaysia|MY,interval=600,timeout=5,url=https://www.gstatic.com/generate_204,tolerance=50
法国节点 = url-test,policy-regex-filter=法国|France|FR,interval=600,timeout=5,url=https://www.gstatic.com/generate_204,tolerance=50
加拿大节点 = url-test,policy-regex-filter=加拿大|Canada|CA,interval=600,timeout=5,url=https://www.gstatic.com/generate_204,tolerance=50
荷兰节点 = url-test,policy-regex-filter=荷兰|Netherlands|NL,interval=600,timeout=5,url=https://www.gstatic.com/generate_204,tolerance=50
土耳其节点 = url-test,policy-regex-filter=土耳其|Turkey|TR,interval=600,timeout=5,url=https://www.gstatic.com/generate_204,tolerance=50
泰国节点 = url-test,policy-regex-filter=泰国|Thailand|TH,interval=600,timeout=5,url=https://www.gstatic.com/generate_204,tolerance=50
爱沙尼亚节点 = url-test,policy-regex-filter=爱沙尼亚|Estonia|EE,interval=600,timeout=5,url=https://www.gstatic.com/generate_204,tolerance=50
稳定节点 = fallback,REJECT,interval=600,timeout=5,url=https://www.gstatic.com/generate_204
自动切换 = fallback,policy-regex-filter=(?:香港|Hong Kong|HK)|(?:台湾|Taiwan|TW)|(?:日本|Japan|JP)|(?:新加坡|Singapore|SG)|(?:美国|United States|USA|US)|(?:英国|United Kingdom|UK)|(?:德国|Germany|DE)|(?:韩国|Korea|KR)|(?:澳大利亚|Australia|AU)|(?:马来西亚|Malaysia|MY)|(?:法国|France|FR)|(?:加拿大|Canada|CA)|(?:荷兰|Netherlands|NL)|(?:土耳其|Turkey|TR)|(?:泰国|Thailand|TH)|(?:爱沙尼亚|Estonia|EE),interval=600,timeout=5,url=https://www.gstatic.com/generate_204
PROXY = select,自动切换,香港节点,台湾节点,日本节点,新加坡节点,美国节点,英国节点,德国节点,韩国节点,澳大利亚节点,马来西亚节点,法国节点,加拿大节点,荷兰节点,土耳其节点,泰国节点,爱沙尼亚节点
AI = select,稳定节点
YouTube = select,PROXY
Spotify = select,DIRECT,PROXY
Telegram = select,PROXY
PayPal = select,DIRECT,PROXY
Twitter = select,PROXY
Facebook = select,PROXY
Amazon = select,DIRECT,PROXY
Microsoft = select,DIRECT,PROXY
Google = select,稳定节点
Apple = select,DIRECT,PROXY
BiliBili = select,DIRECT,PROXY
TikTok = select,PROXY

