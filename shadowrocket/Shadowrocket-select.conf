# Remote rule sets generated from the full MetaCubeX snapshot. No node credentials.
[General]
ipv6 = false
block-quic = always-allow
udp-policy-not-supported-behaviour = REJECT
dns-server = https://1.1.1.1/dns-query#proxy,https://8.8.8.8/dns-query#proxy
direct-dns-server = tls://223.5.5.5:853,tls://120.53.53.53:853
proxy-dns-server = tls://223.5.5.5:853,tls://120.53.53.53:853
fallback-dns-server = https://1.1.1.1/dns-query#proxy,https://8.8.8.8/dns-query#proxy
dns-direct-system = false
dns-direct-fallback-proxy = false
always-real-ip = *.lan,*.local,localhost,pool.ntp.org,*.pool.ntp.org,time.*.com,ntp.*.com,msftconnecttest.com,msftncsi.com

[Proxy]

[Proxy Group]
香港节点 = select,policy-regex-filter=香港|Hong Kong|HK
台湾节点 = select,policy-regex-filter=台湾|Taiwan|TW
日本节点 = select,policy-regex-filter=日本|Japan|JP
新加坡节点 = select,policy-regex-filter=新加坡|Singapore|SG
美国节点 = select,policy-regex-filter=美国|United States|USA|US
英国节点 = select,policy-regex-filter=英国|United Kingdom|UK
德国节点 = select,policy-regex-filter=德国|Germany|DE
韩国节点 = select,policy-regex-filter=韩国|Korea|KR
澳大利亚节点 = select,policy-regex-filter=澳大利亚|Australia|AU
马来西亚节点 = select,policy-regex-filter=马来西亚|Malaysia|MY
法国节点 = select,policy-regex-filter=法国|France|FR
加拿大节点 = select,policy-regex-filter=加拿大|Canada|CA
荷兰节点 = select,policy-regex-filter=荷兰|Netherlands|NL
土耳其节点 = select,policy-regex-filter=土耳其|Turkey|TR
泰国节点 = select,policy-regex-filter=泰国|Thailand|TH
爱沙尼亚节点 = select,policy-regex-filter=爱沙尼亚|Estonia|EE

